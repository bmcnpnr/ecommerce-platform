# Prometheus / Alertmanager / Loki / Tempo / Grafana / Promtail.
#
# Every config file except Promtail's is reused verbatim from
# ../../ecommerce-monitoring — those files address everything by service name
# (prometheus:9090, tempo:4318, user-service:8081 …) and the Services in this
# directory carry exactly the same names, so nothing needed rewriting. The
# deploy script turns those files into ConfigMaps; see k8s/README.md for why
# they are not inlined here.
#
# Promtail is the exception: its compose config discovers containers through
# the Docker socket, which no longer exists here. The version below uses the
# Kubernetes API instead, and adds a `cri` pipeline stage because containerd
# writes logs in CRI format rather than Docker's JSON.
#
# Each stateful component gets a root init container that chowns its volume.
# The images run as non-root (prometheus 65534, grafana 472, loki 10001) and a
# freshly provisioned PVC is owned by root, so without this they start, fail to
# open their data directory, and crash-loop.

# ─── Prometheus ────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
  labels:
    app: prometheus
    group: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-lb
  namespace: ecommerce
  labels:
    app: prometheus
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
  labels:
    app: prometheus
    group: monitoring
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce volume: a rolling update would deadlock waiting for the old
    # pod to release it. Same reason applies to every PVC-backed workload here.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        group: monitoring
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # Size is the bound, time is the target: whichever is reached first
            # deletes the oldest block. The TSDB (blocks + WAL + compaction headroom)
            # must fit in the 10Gi PVC below, and a cardinality or scrape-interval
            # mistake would otherwise grow it without limit. alert
            # PrometheusTsdbNearSizeLimit warns before history is cut short.
            - --storage.tsdb.retention.size=5GB
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
            # Tempo's metrics-generator remote-writes span metrics here.
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

# ─── Alertmanager ──────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
    group: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-lb
  namespace: ecommerce
  labels:
    app: alertmanager
spec:
  type: LoadBalancer
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
    group: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        group: monitoring
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65534:65534 /alertmanager"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: data
              mountPath: /alertmanager
