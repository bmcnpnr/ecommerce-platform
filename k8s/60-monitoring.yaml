        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data

# ─── Loki ──────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ecommerce
  labels:
    app: loki
    group: monitoring
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: ecommerce
  labels:
    app: loki
    group: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        group: monitoring
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /loki"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki-config.yml
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # A restart after a log flood replays the write-ahead log. That can take longer
          # than the liveness probe tolerates (60 s + 6 x 20 s), and a Loki killed
          # mid-replay starts the replay over: a restart loop. The startup probe gives
          # it 10 minutes and holds the other probes off until it is ready.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yml
              subPath: loki-config.yml
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data

# ─── Tempo ─────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ecommerce
  labels:
    app: tempo
    group: monitoring
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    # Every Spring service exports spans to http://tempo:4318 via the
    # OTEL_EXPORTER_OTLP_ENDPOINT in 02-config.yaml.
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ecommerce
  labels:
    app: tempo
    group: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
        group: monitoring
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /var/tempo"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/tempo
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo-config.yml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Same reason as Loki: do not kill it while it replays its WAL.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo-config.yml
              subPath: tempo-config.yml
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data

# ─── Grafana ───────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecommerce
  labels:
    app: grafana
    group: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-lb
  namespace: ecommerce
  labels:
    app: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    # Host port 3001, matching docker-compose.yml's "3001:3000".
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecommerce
  labels:
    app: grafana
    group: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        group: monitoring
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3001
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: traceqlEditor traceQLStreaming metricsSummary
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            # The dashboards mount sits *inside* the data mount. kubelet mounts
            # parents before children, so the PVC lands on /var/lib/grafana
            # first and the ConfigMap on the subdirectory after.
            - name: data
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider

# ─── Promtail ──────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-ecommerce
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-ecommerce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-ecommerce
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ecommerce
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    # hostPath on the node (see the DaemonSet), so a restarted pod resumes where
    # it stopped instead of re-reading every container log from the start.
    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 524288
        timeout: 10s
        # Same retry budget as the compose config (about 85 s): rides out a Loki
        # restart, drops a batch Loki keeps refusing with 429 instead of stalling
        # every pod's logs behind it for the default 8.5 minutes.
        backoff_config:
          min_period: 500ms
          max_period: 10s
          max_retries: 12

    # (An entry longer than 64 KB is cut by Loki's limits_config, as in compose.)

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        # Everything after the two runtime stages is the compose pipeline
        # (ecommerce-monitoring/promtail/promtail-config.yml) verbatim; keep
        # them identical (k8s/check-promtail-parity.sh compares them).
        pipeline_stages:
          # Unwrap the container runtime's log envelope. containerd and CRI-O (kind)
          # write '<ts> stdout F <line>' and need `cri`; cri-dockerd (kubeadm) writes
          # Docker's {"log":...,"stream":...,"time":...} JSON and needs `docker`. The
          # two selectors are mutually exclusive, so one config serves both and a
          # Docker Desktop upgrade that switches the provisioner no longer leaves every
          # line unparsed (the failure used to be silent: lines still ship, with no
          # level label and no structured metadata). `docker` keeps the line's trailing
          # newline, which the multiline stage below would double, hence `replace`.
          - match:
              selector: '{container=~".+"} |~ "^\\{\"log\":"'
              stages:
                - docker: {}
                - replace:
                    expression: '(\n+)$'
                    replace: ''
          - match:
              selector: '{container=~".+"} !~ "^\\{\"log\":"'
              stages:
                - cri: {}
          # One log event per entry. Every Java service logs
          #   2026-10-30 12:00:00 [thread] [correlationId] [traceId] LEVEL logger - message
          # and a stack trace is the lines after it, none of which start with a
          # timestamp. Without this stage each trace line is its own Loki entry. Lines
          # that never match the first-line pattern (nginx) pass straight through.
          - multiline:
              firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} '
              max_wait_time: 3s
              max_lines: 128
          # Kafka has its own layout: "[2026-10-30 12:00:00,123] INFO message (logger)".
          # Same two jobs, own patterns: group its stack traces, take the level.
          - match:
              selector: '{container="kafka"}'
              stages:
                - multiline:
                    firstline: '^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\] '
                    max_wait_time: 3s
                    max_lines: 128
                - regex:
                    expression: '^\[[^\]]+\] (?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL) '
          # The single Spring Boot console pattern (the same in all ten services):
          #   %d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n
          # correlationId and traceId are empty outside a request ("[] []"); each has
          # its own stage so an empty one is skipped instead of being stored as an
          # empty value on every entry. The level is limited to the six Logback names,
          # so the stream label below can never exceed six values. The entry keeps the
          # timestamp the container runtime recorded (nanosecond precision, no
          # time-zone assumption) rather than the pattern's whole second.
          - regex:
              expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[(?P<thread>.*?)\] \[[^\]]*\] \[[^\]]*\] (?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s'
          - regex:
              expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[.*?\] \[(?P<correlationId>[^\]]+)\] \[[^\]]*\] (?:TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s'
          - regex:
              expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[.*?\] \[[^\]]*\] \[(?P<traceId>[^\]]+)\] (?:TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s'
          # Only bounded-cardinality fields may become stream labels. correlationId
          # and traceId are unique per request and thread is near-unique; promoting
          # them would create a new Loki stream per request. They are attached as
          # structured metadata instead, which stays queryable without the
          # cardinality cost.
          - labels:
              level:
          - structured_metadata:
              correlationId:
              traceId:
              thread:
          # What each container wrote, counted before anything is dropped, so the
          # volume alerts also see DEBUG floods and the non-Java containers (Kafka,
          # nginx). Exposed on :9080/metrics as promtail_custom_log_*_total.
          - metrics:
              log_lines_total:
                type: Counter
                description: Log entries (a stack trace counts once) read from the container
                config:
                  match_all: true
                  action: inc
              log_bytes_total:
                type: Counter
                description: Bytes of those log entries
                config:
                  match_all: true
                  count_entry_bytes: true
                  action: add
          # DEBUG and TRACE are not shipped (they stay in `docker logs`).
          - drop:
              source: level
              expression: '^(DEBUG|TRACE)$'
              drop_counter_reason: debug_log_dropped
          # Per-container ceiling. A container that logs more than this (a retry loop
          # writing a line per poll, like the notification-service poison pill that
          # wrote 992 GB) has the excess dropped here, counted in
          # logentry_dropped_lines_total{reason="ratelimit_drop_stage"}, instead of
          # being pushed to Loki. 300 entries/s is about 100 KB/s of ordinary lines,
          # under Loki's per-stream limit (128 KB/s), so for line floods this limit trips
          # first and Loki never has to answer 429; Loki's limit is the backstop for
          # few but huge entries.
          - limit:
              rate: 300
              burst: 2000
              drop: true
              by_label_name: container
              max_distinct_labels: 10000
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: ecommerce
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          # Same allow-list as the compose config: application logs only, not
          # the monitoring stack's own chatter.
          - source_labels: [service]
            action: keep
            regex: (user-service|product-service|catalog-service|order-service|payment-service|shipping-service|review-service|notification-service|api-gateway|service-discovery|kafka|frontend)
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          # Required, not cosmetic. Promtail tails only pods on its own node
          # and decides that by comparing __host__ against its hostname. With
          # no __host__ every discovered target is silently discarded — the
          # symptom is promtail_targets_active_total 0 and no error anywhere
          # (alert PromtailNoActiveTargets).
          # The DaemonSet overrides HOSTNAME with spec.nodeName to match, since
          # a pod's real hostname is the pod name.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          # Resolves to /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: ecommerce
  labels:
    app: promtail
    group: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        group: monitoring
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          env:
            # Must equal the node name for the __host__ relabel above to match.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            # /var/log/pods is root-owned on the node.
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            # Under containerd (kind) the files in /var/log/pods are real, so the
            # mounts above are enough. On a cri-dockerd node (kubeadm) they are
            # symlinks into /var/lib/docker/containers, and without this mount
            # promtail globs the filenames and then fails every one with "failed to
            # tail file, stat failed ... no such file or directory". The pipeline
            # handles both runtimes, so this mount makes the manifest portable;
            # under kind it is an empty directory.
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: container-logs
          hostPath:
            path: /var/log/containers
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
---
# Prometheus scrapes promtail:9080 by name, like every other target (the log
# volume alerts read its promtail_custom_* counters). One node, so one pod.
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: ecommerce
  labels:
    app: promtail
    group: monitoring
spec:
  selector:
    app: promtail
  ports:
    - name: http
      port: 9080
      targetPort: http
