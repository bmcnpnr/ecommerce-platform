# The nine Spring Boot workloads. Uniform by design: same probe shape, same
# envFrom, same init-container gating, so the only per-service differences are
# the port, the database it owns, and whether it talks to Kafka.
#
# Kubernetes has no equivalent of compose's `depends_on: condition:
# service_healthy`. Without something in its place every service would boot
# before postgres and Eureka, fail fast, and back off — CrashLoopBackOff
# stretches to 5 minutes between attempts, so a cold start that should take 90
# seconds can take 10 minutes. The busybox init containers below reproduce the
# compose ordering at a fraction of that cost.
#
# Probes use the split liveness/readiness groups enabled in 02-config.yaml.
# Liveness must never depend on a downstream: pointing it at the aggregate
# /actuator/health would let a 30-second database blip kill every JVM at once.
#
# Every probe waits 5 s for an answer (compose's healthcheck timeout), not the
# 1 s default. A JVM on a saturated node (a log flood, a disk under pressure, ten
# JVMs starting at once with ActiveProcessorCount=2) can stall for a second or two
# in GC or scheduling; with the default each stall counted as a failure, and five
# in a row restarted a healthy pod, which starts all over on the same saturated
# node: a restart storm that hammers Postgres, Kafka and Eureka.
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app: user-service
    group: application
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app: user-service
    group: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        group: application
    spec:
      # preStop drain (15s) + Boot's graceful shutdown phase (30s) must fit.
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-service-discovery
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z service-discovery 8761; do echo 'waiting for service-discovery'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
        - name: wait-for-userdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z userdb 5432; do echo 'waiting for userdb'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: user-service
          image: ecommerce/user-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          # Zero-downtime rollout, second half (the first is the Eureka tuning in
          # every application.yaml). On termination Kubernetes runs this *before*
          # SIGTERM: the pod marks itself OUT_OF_SERVICE in Eureka through the
          # actuator and keeps serving for 15s — long enough for every peer to
          # fetch the registry (5s) and expire its LoadBalancer cache (5s) — so
          # nothing is routed to it by the time SIGTERM starts Boot's graceful
          # shutdown (in-flight requests finish, then it deregisters). Without
          # this, callers kept dialling the dead pod's IP for up to ~30s.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -qO- --post-data='{"status":"OUT_OF_SERVICE"}'
                    --header='Content-Type: application/json'
                    http://localhost:8081/actuator/serviceregistry || true;
                    sleep 15
          envFrom:
            - configMapRef:
                name: java-env
            - secretRef:
                name: eureka-credentials
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://userdb:5432/userdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: userdb-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: userdb-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            # Seeds (or rotates the old default of) the admin account (S-3).
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
