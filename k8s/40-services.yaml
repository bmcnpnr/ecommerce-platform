apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
    group: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        group: application
    spec:
      # preStop drain (15s) + Boot's graceful shutdown phase (30s) must fit.
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-service-discovery
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z service-discovery 8761; do echo 'waiting for service-discovery'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: api-gateway
          image: ecommerce/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Zero-downtime rollout, second half (the first is the Eureka tuning in
          # every application.yaml). On termination Kubernetes runs this *before*
          # SIGTERM: the pod marks itself OUT_OF_SERVICE in Eureka through the
          # actuator and keeps serving for 15s — long enough for every peer to
          # fetch the registry (5s) and expire its LoadBalancer cache (5s) — so
          # nothing is routed to it by the time SIGTERM starts Boot's graceful
          # shutdown (in-flight requests finish, then it deregisters). Without
          # this, callers kept dialling the dead pod's IP for up to ~30s.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -qO- --post-data='{"status":"OUT_OF_SERVICE"}'
                    --header='Content-Type: application/json'
                    http://localhost:8080/actuator/serviceregistry || true;
                    sleep 15
          envFrom:
            - configMapRef:
                name: java-env
            - secretRef:
                name: eureka-credentials
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            # Same as docker-compose.yml: the gateway buffers request bodies (up to 1 MB
            # per in-flight POST) in Netty direct memory, whose default cap is the maximum
            # heap (55 % of 768 Mi = 424 Mi as the JVM rounds it). Heap + direct could pass
            # the 768 Mi limit and OOM-kill the pod; 128m fails the one request instead (a
            # catchable OutOfMemoryError that -XX:+ExitOnOutOfMemoryError does not act on).
            # Measured: 424 + 128 + ~145 non-heap = ~700 Mi of 768 Mi.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxDirectMemorySize=128m
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
