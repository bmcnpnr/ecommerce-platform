apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
    group: application
spec:
  # Only Prometheus and the health probes use this Service (the service has no API). Its readiness
  # includes the Kafka listeners, so a broker outage makes the pod NotReady; keep it in the endpoints
  # anyway, or the scrape that should show the outage would lose the target.
  publishNotReadyAddresses: true
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
    group: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        group: application
    spec:
      # preStop drain (15s) + Boot's graceful shutdown phase (30s) must fit.
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-service-discovery
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z service-discovery 8761; do echo 'waiting for service-discovery'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 29092; do echo 'waiting for kafka'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: notification-service
          image: ecommerce/notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          # Zero-downtime rollout, second half (the first is the Eureka tuning in
          # every application.yaml). On termination Kubernetes runs this *before*
          # SIGTERM: the pod marks itself OUT_OF_SERVICE in Eureka through the
          # actuator and keeps serving for 15s — long enough for every peer to
          # fetch the registry (5s) and expire its LoadBalancer cache (5s) — so
          # nothing is routed to it by the time SIGTERM starts Boot's graceful
          # shutdown (in-flight requests finish, then it deregisters). Without
          # this, callers kept dialling the dead pod's IP for up to ~30s.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -qO- --post-data='{"status":"OUT_OF_SERVICE"}'
                    --header='Content-Type: application/json'
                    http://localhost:8088/actuator/serviceregistry || true;
                    sleep 15
          envFrom:
            - configMapRef:
                name: java-env
            - secretRef:
                name: eureka-credentials
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 640Mi
          # Liveness, not readiness: readiness includes the Kafka listeners, and a broker that stays
          # unreachable for the 5 minutes of this probe would otherwise restart the pod in a loop.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
