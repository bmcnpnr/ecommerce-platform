                  - sh
                  - -c
                  - >-
                    wget -qO- --post-data='{"status":"OUT_OF_SERVICE"}'
                    --header='Content-Type: application/json'
                    http://localhost:8087/actuator/serviceregistry || true;
                    sleep 15
          envFrom:
            - configMapRef:
                name: java-env
            - secretRef:
                name: eureka-credentials
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://reviewdb:5432/reviewdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reviewdb-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reviewdb-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
