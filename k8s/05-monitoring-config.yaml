# GENERATED by sync-monitoring-config.sh — do not edit.
#
# Source of truth is ../../ecommerce-monitoring/. Edit the files there, re-run
# ./sync-monitoring-config.sh, and re-apply. Committed rather than gitignored
# so that `kubectl apply -k .` works on a fresh clone without running anything
# first, and so config changes are reviewable in the diff.
---
apiVersion: v1
data:
  prometheus.yml: "global:\r\n  scrape_interval: 15s\r\n  evaluation_interval: 15s\r\n
    \ scrape_timeout: 10s\r\n  external_labels:\r\n    cluster: ecommerce-local\r\n
    \   environment: development\r\n\r\nalerting:\r\n  alertmanagers:\r\n    - static_configs:\r\n
    \       - targets:\r\n            - alertmanager:9093\r\n\r\nrule_files:\r\n  -
    /etc/prometheus/rules/*.yml\r\n\r\nscrape_configs:\r\n\r\n  # ─── Prometheus self-monitoring
    ──────────────────────────────────────\r\n  - job_name: prometheus\r\n    static_configs:\r\n
    \     - targets: ['localhost:9090']\r\n        labels:\r\n          service: prometheus\r\n\r\n
    \ # ─── Spring Boot microservices ───────────────────────────────────────\r\n
    \ - job_name: api-gateway\r\n    metrics_path: /actuator/prometheus\r\n    static_configs:\r\n
    \     - targets: ['api-gateway:8080']\r\n        labels:\r\n          service:
    api-gateway\r\n          group: application\r\n\r\n  - job_name: user-service\r\n
    \   metrics_path: /actuator/prometheus\r\n    static_configs:\r\n      - targets:
    ['user-service:8081']\r\n        labels:\r\n          service: user-service\r\n
    \         group: application\r\n\r\n  - job_name: product-service\r\n    metrics_path:
    /actuator/prometheus\r\n    static_configs:\r\n      - targets: ['product-service:8082']\r\n
    \       labels:\r\n          service: product-service\r\n          group: application\r\n\r\n
    \ - job_name: catalog-service\r\n    metrics_path: /actuator/prometheus\r\n    static_configs:\r\n
    \     - targets: ['catalog-service:8083']\r\n        labels:\r\n          service:
    catalog-service\r\n          group: application\r\n\r\n  - job_name: order-service\r\n
    \   metrics_path: /actuator/prometheus\r\n    static_configs:\r\n      - targets:
    ['order-service:8084']\r\n        labels:\r\n          service: order-service\r\n
    \         group: application\r\n\r\n  - job_name: payment-service\r\n    metrics_path:
    /actuator/prometheus\r\n    static_configs:\r\n      - targets: ['payment-service:8085']\r\n
    \       labels:\r\n          service: payment-service\r\n          group: application\r\n\r\n
    \ - job_name: shipping-service\r\n    metrics_path: /actuator/prometheus\r\n    static_configs:\r\n
    \     - targets: ['shipping-service:8086']\r\n        labels:\r\n          service:
    shipping-service\r\n          group: application\r\n\r\n  - job_name: review-service\r\n
    \   metrics_path: /actuator/prometheus\r\n    static_configs:\r\n      - targets:
    ['review-service:8087']\r\n        labels:\r\n          service: review-service\r\n
    \         group: application\r\n\r\n  - job_name: notification-service\r\n    metrics_path:
    /actuator/prometheus\r\n    static_configs:\r\n      - targets: ['notification-service:8088']\r\n
    \       labels:\r\n          service: notification-service\r\n          group:
    application\r\n\r\n  - job_name: service-discovery\r\n    metrics_path: /actuator/prometheus\r\n
    \   static_configs:\r\n      - targets: ['service-discovery:8761']\r\n        labels:\r\n
    \         service: service-discovery\r\n          group: application\r\n\r\n  #
    ─── Infrastructure exporters ────────────────────────────────────────\r\n  - job_name:
    node-exporter\r\n    static_configs:\r\n      - targets: ['node-exporter:9100']\r\n
    \       labels:\r\n          service: node-exporter\r\n          group: infrastructure\r\n\r\n
    \ - job_name: cadvisor\r\n    static_configs:\r\n      - targets: ['cadvisor:8080']\r\n
    \       labels:\r\n          service: cadvisor\r\n          group: infrastructure\r\n\r\n
    \ - job_name: kafka-exporter\r\n    static_configs:\r\n      - targets: ['kafka-exporter:9308']\r\n
    \       labels:\r\n          service: kafka\r\n          group: messaging\r\n\r\n
    \ # ─── Database exporters ──────────────────────────────────────────────\r\n
    \ - job_name: postgres-exporter-userdb\r\n    static_configs:\r\n      - targets:
    ['postgres-exporter-userdb:9187']\r\n        labels:\r\n          service: postgres\r\n
    \         database: userdb\r\n          group: database\r\n\r\n  - job_name: postgres-exporter-productdb\r\n
    \   static_configs:\r\n      - targets: ['postgres-exporter-productdb:9187']\r\n
    \       labels:\r\n          service: postgres\r\n          database: productdb\r\n
    \         group: database\r\n\r\n  - job_name: postgres-exporter-orderdb\r\n    static_configs:\r\n
    \     - targets: ['postgres-exporter-orderdb:9187']\r\n        labels:\r\n          service:
    postgres\r\n          database: orderdb\r\n          group: database\r\n\r\n  -
    job_name: postgres-exporter-paymentdb\r\n    static_configs:\r\n      - targets:
    ['postgres-exporter-paymentdb:9187']\r\n        labels:\r\n          service:
    postgres\r\n          database: paymentdb\r\n          group: database\r\n\r\n
    \ - job_name: postgres-exporter-shippingdb\r\n    static_configs:\r\n      - targets:
    ['postgres-exporter-shippingdb:9187']\r\n        labels:\r\n          service:
    postgres\r\n          database: shippingdb\r\n          group: database\r\n\r\n
    \ - job_name: postgres-exporter-reviewdb\r\n    static_configs:\r\n      - targets:
    ['postgres-exporter-reviewdb:9187']\r\n        labels:\r\n          service: postgres\r\n
    \         database: reviewdb\r\n          group: database\r\n\r\n  - job_name:
    postgres-exporter-catalogdb\r\n    static_configs:\r\n      - targets: ['postgres-exporter-catalogdb:9187']\r\n
    \       labels:\r\n          service: postgres\r\n          database: catalogdb\r\n
    \         group: database\r\n\r\n  # ─── Frontend (nginx exporter + blackbox)
    ────────────────────────────\r\n  - job_name: nginx-exporter\r\n    static_configs:\r\n
    \     - targets: ['nginx-exporter:9113']\r\n        labels:\r\n          service:
    frontend-nginx\r\n          group: frontend\r\n\r\n  - job_name: blackbox-http\r\n
    \   metrics_path: /probe\r\n    params:\r\n      module: [http_2xx]\r\n    static_configs:\r\n
    \     - targets:\r\n          - http://api-gateway:8080/actuator/health\r\n          -
    http://user-service:8081/actuator/health\r\n          - http://product-service:8082/actuator/health\r\n
    \         - http://catalog-service:8083/actuator/health\r\n          - http://order-service:8084/actuator/health\r\n
    \         - http://payment-service:8085/actuator/health\r\n          - http://shipping-service:8086/actuator/health\r\n
    \         - http://review-service:8087/actuator/health\r\n          - http://notification-service:8088/actuator/health\r\n
    \         - http://service-discovery:8761/actuator/health\r\n          - http://frontend:80/\r\n
    \   relabel_configs:\r\n      - source_labels: [__address__]\r\n        target_label:
    __param_target\r\n      - source_labels: [__param_target]\r\n        target_label:
    instance\r\n      - target_label: __address__\r\n        replacement: blackbox-exporter:9115\r\n"
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
---
apiVersion: v1
data:
  database-alerts.yml: "groups:\r\n  - name: database.postgres\r\n    interval: 30s\r\n
    \   rules:\r\n      - alert: PostgresDown\r\n        expr: pg_up == 0\r\n        for:
    1m\r\n        labels:\r\n          severity: critical\r\n        annotations:\r\n
    \         summary: \"PostgreSQL is down ({{ $labels.database }})\"\r\n          description:
    \"PostgreSQL exporter for {{ $labels.database }} reports the database is unreachable.\"\r\n\r\n
    \     - alert: PostgresTooManyConnections\r\n        # max_connections is server-scoped
    and carries no datname label, so the\r\n        # previous 'sum by (datname, instance)'
    on both sides produced an empty\r\n        # datname on the denominator and never
    matched. Connections are summed\r\n        # across databases and compared per
    instance.\r\n        expr: |\r\n          sum by (instance) (pg_stat_activity_count)\r\n
    \         /\r\n          on(instance) group_left max by (instance) (pg_settings_max_connections)\r\n
    \         > 0.80\r\n        for: 5m\r\n        labels:\r\n          severity:
    warning\r\n        annotations:\r\n          summary: \"PostgreSQL instance {{
    $labels.instance }} has too many connections\"\r\n          description: \"Connection
    usage is {{ $value | humanizePercentage }} of max_connections.\"\r\n\r\n      -
    alert: PostgresDeadlocks\r\n        expr: rate(pg_stat_database_deadlocks{datname!~\"template.*|postgres\"}[5m])
    > 0\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"PostgreSQL deadlocks detected on {{ $labels.datname }}\"\r\n
    \         description: \"Deadlock rate: {{ $value }} per second on database {{
    $labels.datname }}.\"\r\n\r\n      - alert: PostgresSlowQueries\r\n        # Two
    fixes: the custom query in queries.yml emits\r\n        # <query-key>_<column>,
    i.e. pg_stat_activity_max_tx_duration_max_tx_duration;\r\n        # and the metric
    is a gauge in seconds, so rate() over it could never\r\n        # exceed 60. Compare
    the gauge directly.\r\n        expr: |\r\n          pg_stat_activity_max_tx_duration_max_tx_duration{datname!~\"template.*|postgres\"}
    > 60\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n
    \       annotations:\r\n          summary: \"Long-running queries on {{ $labels.datname
    }}\"\r\n          description: \"There are queries running for more than 60 seconds
    on {{ $labels.datname }}.\"\r\n"
  infrastructure-alerts.yml: "groups:\r\n  - name: infrastructure.containers\r\n    interval:
    30s\r\n    rules:\r\n      - alert: ContainerHighCpuUsage\r\n        # The value
    is in cores, not a ratio, so it is rendered as cores too —\r\n        # humanizePercentage
    here would have reported \"80%\" for 0.8 cores.\r\n        expr: |\r\n          sum(rate(container_cpu_usage_seconds_total{name!=\"\",
    name!~\".*prometheus.*|.*grafana.*|.*cadvisor.*\"}[5m])) by (name)\r\n          >
    1.5\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"High CPU usage for container {{ $labels.name }}\"\r\n          description:
    \"Container {{ $labels.name }} is using {{ $value | printf \\\"%.2f\\\" }} CPU
    cores.\"\r\n\r\n      - alert: ContainerHighMemoryUsage\r\n        # The '> 0'
    guard is essential: containers without a mem_limit report a\r\n        # limit
    of 0, and dividing by it yields +Inf, which trips this alert for\r\n        #
    every such container permanently.\r\n        expr: |\r\n          (\r\n            container_memory_usage_bytes{name!=\"\"}\r\n
    \           / on(name) container_spec_memory_limit_bytes{name!=\"\"}\r\n          )
    > 0.85\r\n          and on(name) container_spec_memory_limit_bytes{name!=\"\"}
    > 0\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"High memory usage for container {{ $labels.name }}\"\r\n
    \         description: \"Container {{ $labels.name }} memory usage is {{ $value
    | humanizePercentage }} of its limit.\"\r\n\r\n      - alert: ContainerRestarting\r\n
    \       # container_start_time_seconds increasing is the whole signal. The old\r\n
    \       # first clause, rate(container_last_seen[5m]) > 0, is a timestamp gauge\r\n
    \       # that always advances ~1s/s and so was always true.\r\n        expr:
    |\r\n          increase(container_start_time_seconds{name!=\"\"}[5m]) > 0\r\n
    \       for: 0m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"Container {{ $labels.name }} is restarting\"\r\n          description:
    \"Container {{ $labels.name }} has restarted recently.\"\r\n\r\n  # node-exporter
    runs inside the Docker engine's Linux VM, so on Docker Desktop\r\n  # these describe
    that VM's resources, not the Windows/macOS host. Wording is\r\n  # deliberate
    — treating them as host metrics leads to chasing phantom alerts.\r\n  - name:
    infrastructure.host\r\n    interval: 30s\r\n    rules:\r\n      - alert: HostHighCpuLoad\r\n
    \       expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))
    * 100) > 80\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n
    \       annotations:\r\n          summary: \"High CPU load in the Docker VM ({{
    $labels.instance }})\"\r\n          description: \"Docker VM CPU usage is {{ $value
    | printf \\\"%.1f\\\" }}% (threshold: 80%).\"\r\n\r\n      - alert: HostOutOfMemory\r\n
    \       expr: |\r\n          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
    < 0.10\r\n        for: 5m\r\n        labels:\r\n          severity: critical\r\n
    \       annotations:\r\n          summary: \"Host is running out of memory\"\r\n
    \         description: \"Only {{ $value | humanizePercentage }} of host memory
    is available.\"\r\n\r\n      - alert: HostDiskSpaceLow\r\n        expr: |\r\n
    \         (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})
    < 0.15\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n
    \       annotations:\r\n          summary: \"Disk space low on host\"\r\n          description:
    \"Only {{ $value | humanizePercentage }} disk space remaining on /.\"\r\n\r\n
    \     - alert: HostDiskSpaceCritical\r\n        expr: |\r\n          (node_filesystem_avail_bytes{mountpoint=\"/\"}
    / node_filesystem_size_bytes{mountpoint=\"/\"}) < 0.05\r\n        for: 2m\r\n
    \       labels:\r\n          severity: critical\r\n        annotations:\r\n          summary:
    \"Disk space critically low on host\"\r\n          description: \"Less than 5%
    disk space remaining on /. Immediate action required.\"\r\n"
  kafka-alerts.yml: "groups:\r\n  - name: kafka.health\r\n    interval: 30s\r\n    rules:\r\n
    \     - alert: KafkaBrokerDown\r\n        expr: kafka_brokers < 1\r\n        for:
    1m\r\n        labels:\r\n          severity: critical\r\n        annotations:\r\n
    \         summary: \"Kafka broker is down\"\r\n          description: \"No Kafka
    brokers are reachable. All messaging will be impacted.\"\r\n\r\n      - alert:
    KafkaConsumerGroupLag\r\n        expr: kafka_consumergroup_lag > 1000\r\n        for:
    5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"Kafka consumer group {{ $labels.consumergroup }} is lagging\"\r\n
    \         description: \"Consumer group {{ $labels.consumergroup }} on topic {{
    $labels.topic }} has a lag of {{ $value }} messages.\"\r\n\r\n      - alert: KafkaConsumerGroupLagCritical\r\n
    \       expr: kafka_consumergroup_lag > 10000\r\n        for: 5m\r\n        labels:\r\n
    \         severity: critical\r\n        annotations:\r\n          summary: \"Critical
    Kafka consumer lag for {{ $labels.consumergroup }}\"\r\n          description:
    \"Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has
    a lag of {{ $value }} messages. Processing is severely behind.\"\r\n\r\n      #
    Replaces a former KafkaTopicOffsetNotGrowing rule that alerted whenever a\r\n
    \     # partition received no messages for 10m. That fired for all 57 partitions\r\n
    \     # of an idle stack (including the 50 internal __consumer_offsets ones) and\r\n
    \     # was never actionable — an idle topic is not an incident.\r\n      - alert:
    KafkaUnderReplicatedPartitions\r\n        expr: sum(kafka_topic_partition_under_replicated_partition)
    > 0\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"Kafka has under-replicated partitions\"\r\n          description:
    \"{{ $value }} partition(s) are under-replicated; the broker may be unhealthy
    or a replica is offline.\"\r\n\r\n      - alert: KafkaPartitionHasNoLeader\r\n
    \       expr: kafka_topic_partition_leader == -1\r\n        for: 5m\r\n        labels:\r\n
    \         severity: critical\r\n        annotations:\r\n          summary: \"Kafka
    partition {{ $labels.topic }}-{{ $labels.partition }} has no leader\"\r\n          description:
    \"Producers and consumers for topic {{ $labels.topic }} will fail until a leader
    is elected.\"\r\n"
  service-alerts.yml: "groups:\r\n  - name: service.availability\r\n    interval:
    30s\r\n    rules:\r\n      - alert: ServiceDown\r\n        expr: up{group=\"application\"}
    == 0\r\n        for: 1m\r\n        labels:\r\n          severity: critical\r\n
    \       annotations:\r\n          summary: \"Service {{ $labels.service }} is
    down\"\r\n          description: \"{{ $labels.service }} has been unreachable
    for more than 1 minute.\"\r\n\r\n      - alert: ServiceEndpointUnhealthy\r\n        expr:
    probe_success{job=\"blackbox-http\"} == 0\r\n        for: 2m\r\n        labels:\r\n
    \         severity: critical\r\n        annotations:\r\n          summary: \"Health
    endpoint unreachable: {{ $labels.instance }}\"\r\n          description: \"Blackbox
    probe failed for {{ $labels.instance }} for more than 2 minutes.\"\r\n\r\n  -
    name: service.http\r\n    interval: 30s\r\n    rules:\r\n      - alert: HighErrorRate\r\n
    \       expr: |\r\n          sum(rate(http_server_requests_seconds_count{outcome=\"SERVER_ERROR\",
    group=\"application\"}[5m])) by (service)\r\n          /\r\n          sum(rate(http_server_requests_seconds_count{group=\"application\"}[5m]))
    by (service)\r\n          > 0.05\r\n        for: 5m\r\n        labels:\r\n          severity:
    warning\r\n        annotations:\r\n          summary: \"High HTTP error rate on
    {{ $labels.service }}\"\r\n          description: \"{{ $labels.service }} has
    a 5xx error rate above 5% over the last 5 minutes (current: {{ $value | humanizePercentage
    }}).\"\r\n\r\n      - alert: CriticalErrorRate\r\n        expr: |\r\n          sum(rate(http_server_requests_seconds_count{outcome=\"SERVER_ERROR\",
    group=\"application\"}[5m])) by (service)\r\n          /\r\n          sum(rate(http_server_requests_seconds_count{group=\"application\"}[5m]))
    by (service)\r\n          > 0.20\r\n        for: 2m\r\n        labels:\r\n          severity:
    critical\r\n        annotations:\r\n          summary: \"Critical HTTP error rate
    on {{ $labels.service }}\"\r\n          description: \"{{ $labels.service }} has
    a 5xx error rate above 20% (current: {{ $value | humanizePercentage }}).\"\r\n\r\n
    \     - alert: HighP99Latency\r\n        expr: |\r\n          histogram_quantile(0.99,\r\n
    \           sum(rate(http_server_requests_seconds_bucket{group=\"application\"}[5m]))
    by (le, service)\r\n          ) > 2.0\r\n        for: 5m\r\n        labels:\r\n
    \         severity: warning\r\n        annotations:\r\n          summary: \"High
    P99 latency on {{ $labels.service }}\"\r\n          description: \"{{ $labels.service
    }} P99 response time is {{ $value | humanizeDuration }} (threshold: 2s).\"\r\n\r\n
    \ - name: service.jvm\r\n    interval: 30s\r\n    rules:\r\n      - alert: JvmHeapUsageHigh\r\n
    \       expr: |\r\n          (jvm_memory_used_bytes{area=\"heap\"} / jvm_memory_max_bytes{area=\"heap\"})
    > 0.85\r\n        for: 5m\r\n        labels:\r\n          severity: warning\r\n
    \       annotations:\r\n          summary: \"High JVM heap usage on {{ $labels.application
    }}\"\r\n          description: \"Heap usage is {{ $value | humanizePercentage
    }} on {{ $labels.application }} ({{ $labels.instance }}).\"\r\n\r\n      - alert:
    JvmHeapUsageCritical\r\n        expr: |\r\n          (jvm_memory_used_bytes{area=\"heap\"}
    / jvm_memory_max_bytes{area=\"heap\"}) > 0.95\r\n        for: 2m\r\n        labels:\r\n
    \         severity: critical\r\n        annotations:\r\n          summary: \"Critical
    JVM heap usage on {{ $labels.application }}\"\r\n          description: \"Heap
    usage is {{ $value | humanizePercentage }} on {{ $labels.application }}. OOM risk
    is high.\"\r\n\r\n      - alert: JvmGcPauseHigh\r\n        # The trailing guard
    matters: at a scrape boundary rate() can extrapolate\r\n        # the sum above
    zero while the count rate is still zero, so the division\r\n        # yields +Inf
    and trips the threshold. Observed on api-gateway during\r\n        # startup,
    where a single full GC produced a spurious +Inf.\r\n        expr: |\r\n          (\r\n
    \           rate(jvm_gc_pause_seconds_sum[5m]) / rate(jvm_gc_pause_seconds_count[5m])
    > 0.5\r\n          )\r\n          and rate(jvm_gc_pause_seconds_count[5m]) > 0\r\n
    \       for: 5m\r\n        labels:\r\n          severity: warning\r\n        annotations:\r\n
    \         summary: \"High GC pause time on {{ $labels.application }}\"\r\n          description:
    \"Average GC pause on {{ $labels.application }} is {{ $value | humanizeDuration
    }}.\"\r\n\r\n  - name: service.circuitbreaker\r\n    interval: 30s\r\n    rules:\r\n
    \     - alert: CircuitBreakerOpen\r\n        expr: resilience4j_circuitbreaker_state{state=\"open\"}
    == 1\r\n        for: 1m\r\n        labels:\r\n          severity: warning\r\n
    \       annotations:\r\n          summary: \"Circuit breaker OPEN on {{ $labels.application
    }}\"\r\n          description: \"Circuit breaker '{{ $labels.name }}' is OPEN
    on {{ $labels.application }}.\"\r\n"
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: ecommerce
---
apiVersion: v1
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # Configure SMTP here if email alerts are needed:
      # smtp_smarthost: 'smtp.gmail.com:587'
      # smtp_from: 'alerts@yourdomain.com'
      # smtp_auth_username: 'alerts@yourdomain.com'
      # smtp_auth_password: '$SMTP_PASSWORD'

    route:
      group_by: ['alertname', 'service', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'default-receiver'
      routes:
        - matchers:
            - severity = "critical"
          receiver: 'critical-receiver'
          group_wait: 0s
          repeat_interval: 15m
        - matchers:
            - severity = "warning"
          receiver: 'warning-receiver'
          repeat_interval: 4h
        - matchers:
            - alertname = "KafkaBrokerDown"
          receiver: 'critical-receiver'
          group_wait: 0s
        - matchers:
            - alertname = "PostgresDown"
          receiver: 'critical-receiver'
          group_wait: 0s

    # These receivers intentionally declare no notifier. Routing, grouping,
    # inhibition and the Alertmanager UI at :9093 all work; nothing is delivered
    # outbound. The previous configuration posted to http://localhost:5001, which
    # resolves to the Alertmanager container itself where nothing listens, so every
    # notification failed and the error was retried indefinitely.
    # To enable delivery, uncomment one of the blocks below and fill in the target.
    receivers:
      - name: 'default-receiver'
        # webhook_configs:
        #   - url: 'http://your-webhook-host:5001/alerts'
        #     send_resolved: true

      - name: 'critical-receiver'
        # slack_configs:
        #   - api_url: '$SLACK_WEBHOOK_URL'
        #     channel: '#alerts-critical'
        #     title: '{{ .GroupLabels.alertname }}'
        #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        #     send_resolved: true

      - name: 'warning-receiver'
        # slack_configs:
        #   - api_url: '$SLACK_WEBHOOK_URL'
        #     channel: '#alerts'
        #     send_resolved: true

    inhibit_rules:
      # If a critical alert fires, suppress the corresponding warning
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'service']
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ecommerce
---
apiVersion: v1
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://alertmanager:9093

    limits_config:
      retention_period: 744h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_query_series: 10000
      # Must be >= retention_period, otherwise the oldest retained logs are kept on
      # disk but rejected by every query.
      max_query_lookback: 744h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      compaction_interval: 10m
kind: ConfigMap
metadata:
  name: loki-config
  namespace: ecommerce
---
apiVersion: v1
data:
  tempo-config.yml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger:
          protocols:
            thrift_http:
              endpoint: 0.0.0.0:14268
            grpc:
              endpoint: 0.0.0.0:14250

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 48h

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: ecommerce-local
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus:9090/api/v1/write
            send_exemplars: true

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ecommerce
---
apiVersion: v1
data:
  datasources.yml: "apiVersion: 1\r\n\r\ndatasources:\r\n  # The uid values are referenced
    by literal string from the Tempo datasource\r\n  # below (serviceMap, tracesToLogsV2)
    and from the dashboards, so they must be\r\n  # pinned rather than auto-generated.\r\n
    \ - name: Prometheus\r\n    type: prometheus\r\n    uid: prometheus\r\n    access:
    proxy\r\n    url: http://prometheus:9090\r\n    isDefault: true\r\n    editable:
    false\r\n    jsonData:\r\n      timeInterval: 15s\r\n      exemplarTraceIdDestinations:\r\n
    \       - name: traceID\r\n          datasourceUid: tempo\r\n\r\n  - name: Loki\r\n
    \   type: loki\r\n    uid: loki\r\n    access: proxy\r\n    url: http://loki:3100\r\n
    \   editable: false\r\n    jsonData:\r\n      derivedFields:\r\n        - datasourceUid:
    tempo\r\n          matcherRegex: '\"traceId\":\"(\\w+)\"'\r\n          name: TraceID\r\n
    \         url: '$${__value.raw}'\r\n\r\n  - name: Tempo\r\n    type: tempo\r\n
    \   access: proxy\r\n    url: http://tempo:3200\r\n    editable: false\r\n    uid:
    tempo\r\n    jsonData:\r\n      tracesToLogsV2:\r\n        datasourceUid: loki\r\n
    \       spanStartTimeShift: '-1h'\r\n        spanEndTimeShift: '1h'\r\n        filterByTraceID:
    true\r\n        filterBySpanID: false\r\n      serviceMap:\r\n        datasourceUid:
    prometheus\r\n      search:\r\n        hide: false\r\n      nodeGraph:\r\n        enabled:
    true\r\n"
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecommerce
---
apiVersion: v1
data:
  dashboards.yml: "apiVersion: 1\r\n\r\nproviders:\r\n  - name: ecommerce-dashboards\r\n
    \   orgId: 1\r\n    type: file\r\n    disableDeletion: false\r\n    updateIntervalSeconds:
    30\r\n    allowUiUpdates: true\r\n    options:\r\n      path: /var/lib/grafana/dashboards\r\n
    \     foldersFromFilesStructure: false\r\n"
