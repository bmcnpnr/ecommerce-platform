    [{ \"type\": \"value\", \"options\": { \"0\": { \"text\": \"CLOSED\" }, \"1\":
    { \"text\": \"OPEN\" }, \"2\": { \"text\": \"HALF_OPEN\" } } }]\r\n        }\r\n
    \     },\r\n      \"targets\": [\r\n        { \"expr\": \"resilience4j_circuitbreaker_state{state=\\\"open\\\"}\",
    \"legendFormat\": \"OPEN - {{application}} {{name}}\" },\r\n        { \"expr\":
    \"resilience4j_circuitbreaker_state{state=\\\"half_open\\\"}\", \"legendFormat\":
    \"HALF_OPEN - {{application}} {{name}}\" }\r\n      ],\r\n      \"datasource\":
    \"Prometheus\"\r\n    }\r\n  ]\r\n}\r\n"
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: ecommerce
---
apiVersion: v1
data:
  blackbox-config.yml: "modules:\r\n  http_2xx:\r\n    prober: http\r\n    timeout:
    5s\r\n    http:\r\n      valid_http_versions: [\"HTTP/1.1\", \"HTTP/2.0\"]\r\n
    \     valid_status_codes: [200, 204]\r\n      method: GET\r\n      headers:\r\n
    \       Accept: application/json\r\n      follow_redirects: true\r\n      preferred_ip_protocol:
    ip4\r\n\r\n  http_post_2xx:\r\n    prober: http\r\n    timeout: 5s\r\n    http:\r\n
    \     valid_http_versions: [\"HTTP/1.1\", \"HTTP/2.0\"]\r\n      valid_status_codes:
    [200, 201]\r\n      method: POST\r\n      follow_redirects: true\r\n\r\n  tcp_connect:\r\n
    \   prober: tcp\r\n    timeout: 5s\r\n\r\n  dns:\r\n    prober: dns\r\n    timeout:
    5s\r\n    dns:\r\n      query_name: \"service-discovery\"\r\n      query_type:
    \"A\"\r\n"
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: ecommerce
---
apiVersion: v1
data:
  queries.yml: "# Custom PostgreSQL queries for postgres_exporter\r\n# These supplement
    the default metrics with application-specific insights\r\n\r\npg_stat_activity_max_tx_duration:\r\n
    \ query: |\r\n    SELECT datname,\r\n           COALESCE(MAX(EXTRACT(EPOCH FROM
    (now() - xact_start))), 0) AS max_tx_duration\r\n    FROM pg_stat_activity\r\n
    \   WHERE state != 'idle'\r\n      AND datname NOT IN ('postgres', 'template0',
    'template1')\r\n    GROUP BY datname\r\n  metrics:\r\n    - datname:\r\n        usage:
    \"LABEL\"\r\n        description: \"Database name\"\r\n    - max_tx_duration:\r\n
    \       usage: \"GAUGE\"\r\n        description: \"Maximum duration of active
    transactions in seconds\"\r\n\r\npg_stat_table_bloat:\r\n  query: |\r\n    SELECT
    schemaname, tablename,\r\n           pg_total_relation_size(quote_ident(schemaname)
    || '.' || quote_ident(tablename)) AS total_bytes,\r\n           pg_relation_size(quote_ident(schemaname)
    || '.' || quote_ident(tablename)) AS table_bytes\r\n    FROM pg_tables\r\n    WHERE
    schemaname NOT IN ('pg_catalog', 'information_schema')\r\n  metrics:\r\n    -
    schemaname:\r\n        usage: \"LABEL\"\r\n        description: \"Schema name\"\r\n
    \   - tablename:\r\n        usage: \"LABEL\"\r\n        description: \"Table name\"\r\n
    \   - total_bytes:\r\n        usage: \"GAUGE\"\r\n        description: \"Total
    bytes including indexes and toast\"\r\n    - table_bytes:\r\n        usage: \"GAUGE\"\r\n
    \       description: \"Table size in bytes\"\r\n\r\npg_connections_by_state:\r\n
    \ query: |\r\n    SELECT state, COUNT(*) AS count\r\n    FROM pg_stat_activity\r\n
    \   WHERE datname NOT IN ('postgres', 'template0', 'template1')\r\n    GROUP BY
    state\r\n  metrics:\r\n    - state:\r\n        usage: \"LABEL\"\r\n        description:
    \"Connection state\"\r\n    - count:\r\n        usage: \"GAUGE\"\r\n        description:
    \"Number of connections in this state\"\r\n\r\npg_slow_queries:\r\n  query: |\r\n
    \   SELECT\r\n      datname,\r\n      COUNT(*) AS count\r\n    FROM pg_stat_activity\r\n
    \   WHERE state != 'idle'\r\n      AND datname NOT IN ('postgres', 'template0',
    'template1')\r\n      AND EXTRACT(EPOCH FROM (now() - query_start)) > 5\r\n    GROUP
    BY datname\r\n  metrics:\r\n    - datname:\r\n        usage: \"LABEL\"\r\n        description:
    \"Database name\"\r\n    - count:\r\n        usage: \"GAUGE\"\r\n        description:
    \"Number of queries running longer than 5 seconds\"\r\n"
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: ecommerce
