# One postgres-exporter per database, matching docker-compose.yml.
#
# Unlike compose, every exporter listens on 9187 — each has its own Service, so
# there is no host-port collision to work around and prometheus.yml's
# postgres-exporter-<db>:9187 targets work unchanged.
#
# DATA_SOURCE_NAME (user, password, host and database in one URI) lives in the
# same Secret as the database's own credentials, so a password rotation is a
# one-line edit rather than three.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-userdb
  namespace: ecommerce
  labels:
    app: postgres-exporter-userdb
    group: database
    database: userdb
spec:
  selector:
    app: postgres-exporter-userdb
  ports:
    - name: http
      port: 9187
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-userdb
  namespace: ecommerce
  labels:
    app: postgres-exporter-userdb
    group: database
    database: userdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter-userdb
  template:
    metadata:
      labels:
        app: postgres-exporter-userdb
        group: database
        database: userdb
    spec:
      initContainers:
        - name: wait-for-userdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z userdb 5432; do echo 'waiting for userdb'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: userdb-credentials
                  key: DATA_SOURCE_NAME
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres-exporter/queries.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-queries
---
