apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every manifest already carries `namespace: ecommerce`, so the namespace
# transformer is deliberately not set here — it would also try to stamp a
# namespace onto the cluster-scoped Namespace, ClusterRole and
# ClusterRoleBinding objects.

resources:
  - 00-namespace.yaml
  - 01-secrets.yaml
  - 02-config.yaml
  - 05-monitoring-config.yaml   # generated by ./sync-monitoring-config.sh
  - 10-databases.yaml
  - 20-kafka.yaml
  - 30-service-discovery.yaml
  - 40-services.yaml
  - 50-frontend.yaml
  - 60-monitoring.yaml
  - 70-exporters.yaml
  - 71-postgres-exporters.yaml

# includeSelectors: false is load-bearing. The older commonLabels field folds
# its labels into spec.selector as well, and a Deployment's selector is
# immutable — every later apply that changed this list would be rejected.
labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce-platform
    includeSelectors: false
