# One database instance per service, mirroring docker-compose.yml: PostgreSQL
# for six of them, MongoDB for catalogdb (catalog-service keeps a join-free read
# model; see its README). The Mongo StatefulSet follows the same shape and is
# described at its own definition below.
#
# StatefulSet rather than Deployment: the identity (userdb-0) and its PVC stay
# bound together across restarts, and the default rolling update never runs two
# postgres processes against the same volume — a Deployment would, briefly, and
# postgres refuses to start on a directory another postmaster still holds.
#
# PGDATA points at a *subdirectory* of the mount. The volume root belongs to the
# provisioner and postgres' initdb insists on an empty directory it owns.
#
# The <name>-lb Services publish each database on the same host port as
# docker-compose.yml, so existing psql/DataGrip connections keep working. They
# are separate objects from the in-cluster Service so that the internal name
# and port (userdb:5432) stay untouched.
---
apiVersion: v1
kind: Service
metadata:
  name: userdb
  namespace: ecommerce
  labels:
    app: userdb
    group: database
spec:
  selector:
    app: userdb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: userdb-lb
  namespace: ecommerce
  labels:
    app: userdb
    group: database
spec:
  type: LoadBalancer
  selector:
    app: userdb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: userdb
  namespace: ecommerce
  labels:
    app: userdb
    group: database
spec:
  serviceName: userdb
  replicas: 1
  selector:
    matchLabels:
      app: userdb
  template:
    metadata:
      labels:
        app: userdb
        group: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: userdb-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
