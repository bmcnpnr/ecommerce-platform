---
# catalogdb — MongoDB 8, the one non-Postgres database. Same object names,
# labels and StatefulSet shape as its neighbours so deploy.sh/deploy.ps1
# (`rollout status statefulset/catalogdb`) and the catalog-service init
# container (`nc -z catalogdb`) needed only the port changed.
#
# The PVC is mounted with subPath "mongo" for the same reason Postgres uses a
# PGDATA subdirectory: the volume root belongs to the provisioner. It also
# means a PVC left over from the Postgres catalogdb (pgdata/ at the root) does
# not collide with mongod's files — but that PVC is dead weight; on a cluster
# that ran the old engine, delete it once:
#   kubectl -n ecommerce delete statefulset catalogdb
#   kubectl -n ecommerce delete pvc data-catalogdb-0
apiVersion: v1
kind: Service
metadata:
  name: catalogdb
  namespace: ecommerce
  labels:
    app: catalogdb
    group: database
spec:
  selector:
    app: catalogdb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: catalogdb-lb
  namespace: ecommerce
  labels:
    app: catalogdb
    group: database
spec:
  type: LoadBalancer
  selector:
    app: catalogdb
  ports:
    - name: mongodb
      # Same host port as docker-compose.yml, so mongosh/Compass sessions
      # against localhost:27017 work on either stack.
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogdb
  namespace: ecommerce
  labels:
    app: catalogdb
    group: database
spec:
  serviceName: catalogdb
  replicas: 1
  selector:
    matchLabels:
      app: catalogdb
  template:
    metadata:
      labels:
        app: catalogdb
        group: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          # WiredTiger sizes its cache from the cgroup limit and would otherwise
          # claim all of it; 0.25 GB is the minimum. Matches docker-compose.yml,
          # including --quiet (no "Connection accepted/ended" and client-metadata
          # lines, two thirds of mongod's per-connection log output) and --slowms
          # 1000 (log only operations slower than a second, not 100 ms).
          args: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--quiet", "--slowms", "1000"]
          ports:
            - name: mongodb
              containerPort: 27017
          envFrom:
            - secretRef:
                name: catalogdb-credentials
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Authenticated ping, as in compose: the image's first boot runs a
          # temporary auth-less mongod while creating the root user, and an
          # unauthenticated ping would pass against that too early.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data/db
              subPath: mongo
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
