# Development credentials, carried over verbatim from docker-compose.yml so the
# two stacks behave identically. They are committed on purpose: nothing here is
# reachable outside the local cluster. For anything shared, replace this file
# with a SealedSecret / External Secrets reference and drop it from kustomization.yaml.
#
# Each database secret carries three roles at once:
#   POSTGRES_*        consumed by the postgres StatefulSet itself
#   DB_USERNAME/...   consumed by the Spring service that owns the database
#   DATA_SOURCE_NAME  consumed by that database's postgres-exporter
# Keeping them in one object means the password exists in exactly one place.
#
# catalogdb is MongoDB rather than Postgres, so its secret uses the mongo
# image's MONGO_INITDB_ROOT_* keys and a MONGODB_URI for the mongodb-exporter;
# the roles are the same three.
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SECRET: myVerySecretJwtKeyThatIsAtLeast32CharactersLongForHS256
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: userdb-credentials
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_DB: userdb
  POSTGRES_USER: useruser
  POSTGRES_PASSWORD: userpass
  DATA_SOURCE_NAME: postgresql://useruser:userpass@userdb:5432/userdb?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: productdb-credentials
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_DB: productdb
  POSTGRES_USER: productuser
  POSTGRES_PASSWORD: productpass
  DATA_SOURCE_NAME: postgresql://productuser:productpass@productdb:5432/productdb?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: catalogdb-credentials
  namespace: ecommerce
type: Opaque
stringData:
  MONGO_INITDB_DATABASE: catalogdb
  MONGO_INITDB_ROOT_USERNAME: cataloguser
  MONGO_INITDB_ROOT_PASSWORD: catalogpass
  # The root user is created in the admin database, hence /admin here and
  # authentication-database: admin in the service.
  MONGODB_URI: mongodb://cataloguser:catalogpass@catalogdb:27017/admin
---
