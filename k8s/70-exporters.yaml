# Metrics exporters and the Kafka UI.
#
# Service names and ports are identical to docker-compose.yml on purpose:
# prometheus.yml scrapes node-exporter:9100, cadvisor:8080, kafka-exporter:9308
# and so on by name, so reusing the file required no edits.

# ─── node-exporter ─────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: ecommerce
  labels:
    app: node-exporter
    group: infrastructure
spec:
  selector:
    app: node-exporter
  ports:
    - name: http
      port: 9100
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: ecommerce
  labels:
    app: node-exporter
    group: infrastructure
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
        group: infrastructure
    spec:
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.1
          imagePullPolicy: IfNotPresent
          args:
            - --path.rootfs=/host
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
          ports:
            - name: http
              containerPort: 9100
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /

# ─── cAdvisor ──────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: ecommerce
  labels:
    app: cadvisor
    group: infrastructure
spec:
  selector:
    app: cadvisor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: ecommerce
  labels:
    app: cadvisor
    group: infrastructure
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
        group: infrastructure
    spec:
      # cAdvisor reads cgroups, not the Kubernetes API, so it has no use for a
      # token — and mounting one is actively fatal here. The host's /var/run is
      # mounted read-only over the container's, so runc cannot create the
      # /var/run/secrets/kubernetes.io/serviceaccount mountpoint underneath it
      # and the container dies with ContainerCannotRun before it starts.
      automountServiceAccountToken: false
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          imagePullPolicy: IfNotPresent
          # --docker_only is deliberately dropped from the compose command.
          # Pods here are containerd containers, not Docker ones, so keeping it
          # would filter out every workload this stack is meant to measure.
          args:
            - --housekeeping_interval=15s
            - --store_container_labels=false
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 320Mi
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: disk
              mountPath: /dev/disk
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker
        - name: disk
          hostPath:
            path: /dev/disk

# ─── kafka-exporter ────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: ecommerce
  labels:
    app: kafka-exporter
    group: messaging
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: http
      port: 9308
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: ecommerce
  labels:
    app: kafka-exporter
    group: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        group: messaging
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 29092; do echo 'waiting for kafka'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          imagePullPolicy: IfNotPresent
          args:
            - --kafka.server=kafka:29092
            - --web.listen-address=:9308
          ports:
            - name: http
              containerPort: 9308
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi

# ─── kafka-ui ──────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: ecommerce
  labels:
    app: kafka-ui
    group: messaging
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-lb
  namespace: ecommerce
  labels:
    app: kafka-ui
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: ecommerce
  labels:
    app: kafka-ui
    group: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
        group: messaging
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 29092; do echo 'waiting for kafka'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: ecommerce
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:29092
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10

# ─── blackbox-exporter ─────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: ecommerce
  labels:
    app: blackbox-exporter
    group: infrastructure
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: ecommerce
  labels:
    app: blackbox-exporter
    group: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        group: infrastructure
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/blackbox/blackbox-config.yml
          ports:
            - name: http
              containerPort: 9115
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
      volumes:
        - name: config
          configMap:
            name: blackbox-config

# ─── nginx-exporter ────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: ecommerce
  labels:
    app: nginx-exporter
    group: frontend
spec:
  selector:
    app: nginx-exporter
  ports:
    - name: http
      port: 9113
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: ecommerce
  labels:
    app: nginx-exporter
    group: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
        group: frontend
    spec:
      containers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --nginx.scrape-uri=http://frontend:80/stub_status
          ports:
            - name: http
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
