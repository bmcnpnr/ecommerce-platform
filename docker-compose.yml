version: '3.8'

networks:
  ecommerce-network:
    driver: bridge

volumes:
  userdb-data:
  productdb-data:
  catalogdb-data:
  orderdb-data:
  paymentdb-data:
  shippingdb-data:
  reviewdb-data:
  kafka-data:
  # ─── Monitoring volumes ──────────────────────────────────────────────
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:

services:

  # ─── Infrastructure ─────────────────────────────────────────────────

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Databases ──────────────────────────────────────────────────────

  userdb:
    image: postgres:16-alpine
    container_name: userdb
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5432:5432"
    volumes:
      - userdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  productdb:
    image: postgres:16-alpine
    container_name: productdb
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: productpass
    ports:
      - "5433:5432"
    volumes:
      - productdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogdb:
    image: postgres:16-alpine
    container_name: catalogdb
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: cataloguser
      POSTGRES_PASSWORD: catalogpass
    ports:
      - "5435:5432"
    volumes:
      - catalogdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataloguser -d catalogdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  orderdb:
    image: postgres:16-alpine
    container_name: orderdb
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5434:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  paymentdb:
    image: postgres:16-alpine
    container_name: paymentdb
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: paymentuser
      POSTGRES_PASSWORD: paymentpass
    ports:
      - "5436:5432"
    volumes:
      - paymentdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentuser -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  shippingdb:
    image: postgres:16-alpine
    container_name: shippingdb
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: shippinguser
      POSTGRES_PASSWORD: shippingpass
    ports:
      - "5437:5432"
    volumes:
      - shippingdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shippinguser -d shippingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  reviewdb:
    image: postgres:16-alpine
    container_name: reviewdb
    environment:
      POSTGRES_DB: reviewdb
      POSTGRES_USER: reviewuser
      POSTGRES_PASSWORD: reviewpass
    ports:
      - "5438:5432"
    volumes:
      - reviewdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewuser -d reviewdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────────────

  service-discovery:
    build:
      context: ../ecommerce-service-discovery
      dockerfile: docker/Dockerfile
    container_name: service-discovery
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: ../ecommerce-user-service
      dockerfile: docker/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://userdb:5432/userdb
      DB_USERNAME: useruser
      DB_PASSWORD: userpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-myVerySecretJwtKeyThatIsAtLeast32CharactersLongForHS256}
    depends_on:
      userdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  product-service:
    build:
      context: ../ecommerce-product-service
      dockerfile: docker/Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://productdb:5432/productdb
      DB_USERNAME: productuser
      DB_PASSWORD: productpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      productdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  catalog-service:
    build:
      context: ../ecommerce-catalog-service
      dockerfile: docker/Dockerfile
    container_name: catalog-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalogdb:5432/catalogdb
      DB_USERNAME: cataloguser
      DB_PASSWORD: catalogpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      catalogdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  order-service:
    build:
      context: ../ecommerce-order-service
      dockerfile: docker/Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orderdb:5432/orderdb
      DB_USERNAME: orderuser
      DB_PASSWORD: orderpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      orderdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  payment-service:
    build:
      context: ../ecommerce-payment-service
      dockerfile: docker/Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://paymentdb:5432/paymentdb
      DB_USERNAME: paymentuser
      DB_PASSWORD: paymentpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      paymentdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  shipping-service:
    build:
      context: ../ecommerce-shipping-service
      dockerfile: docker/Dockerfile
    container_name: shipping-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shippingdb:5432/shippingdb
      DB_USERNAME: shippinguser
      DB_PASSWORD: shippingpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      shippingdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  review-service:
    build:
      context: ../ecommerce-review-service
      dockerfile: docker/Dockerfile
    container_name: review-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reviewdb:5432/reviewdb
      DB_USERNAME: reviewuser
      DB_PASSWORD: reviewpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      reviewdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  notification-service:
    build:
      context: ../ecommerce-notification-service
      dockerfile: docker/Dockerfile
    container_name: notification-service
    ports:
      - "8088:8088"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  api-gateway:
    build:
      context: ../ecommerce-api-gateway
      dockerfile: docker/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-myVerySecretJwtKeyThatIsAtLeast32CharactersLongForHS256}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      ENVIRONMENT: development
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ─── Monitoring Stack ────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ../ecommerce-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ecommerce-monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - ecommerce-network
    depends_on:
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceQLStreaming metricsSummary
    volumes:
      - ../ecommerce-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ecommerce-monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../ecommerce-monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../ecommerce-monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ecommerce-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../ecommerce-monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../ecommerce-monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Infrastructure Exporters ────────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro
    networks:
      - ecommerce-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "9095:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - ecommerce-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
    ports:
      - "9308:9308"
    networks:
      - ecommerce-network
    depends_on:
      kafka:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    command: --config.file=/etc/blackbox/blackbox-config.yml
    ports:
      - "9115:9115"
    volumes:
      - ../ecommerce-monitoring/blackbox-exporter/blackbox-config.yml:/etc/blackbox/blackbox-config.yml:ro
    networks:
      - ecommerce-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:80/stub_status
    ports:
      - "9113:9113"
    networks:
      - ecommerce-network
    depends_on:
      - frontend

  # ─── PostgreSQL Exporters (one per database) ─────────────────────────

  postgres-exporter-userdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-userdb
    environment:
      DATA_SOURCE_NAME: postgresql://useruser:userpass@userdb:5432/userdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9187:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      userdb:
        condition: service_healthy
    labels:
      database: userdb

  postgres-exporter-productdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-productdb
    environment:
      DATA_SOURCE_NAME: postgresql://productuser:productpass@productdb:5432/productdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9188:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      productdb:
        condition: service_healthy
    labels:
      database: productdb

  postgres-exporter-catalogdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-catalogdb
    environment:
      DATA_SOURCE_NAME: postgresql://cataloguser:catalogpass@catalogdb:5432/catalogdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9189:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      catalogdb:
        condition: service_healthy
    labels:
      database: catalogdb

  postgres-exporter-orderdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-orderdb
    environment:
      DATA_SOURCE_NAME: postgresql://orderuser:orderpass@orderdb:5432/orderdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9190:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      orderdb:
        condition: service_healthy
    labels:
      database: orderdb

  postgres-exporter-paymentdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-paymentdb
    environment:
      DATA_SOURCE_NAME: postgresql://paymentuser:paymentpass@paymentdb:5432/paymentdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9191:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      paymentdb:
        condition: service_healthy
    labels:
      database: paymentdb

  postgres-exporter-shippingdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-shippingdb
    environment:
      DATA_SOURCE_NAME: postgresql://shippinguser:shippingpass@shippingdb:5432/shippingdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9192:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      shippingdb:
        condition: service_healthy
    labels:
      database: shippingdb

  postgres-exporter-reviewdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-reviewdb
    environment:
      DATA_SOURCE_NAME: postgresql://reviewuser:reviewpass@reviewdb:5432/reviewdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9193:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      reviewdb:
        condition: service_healthy
    labels:
      database: reviewdb

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../ecommerce-frontend
      dockerfile: Dockerfile
      args:
        # Relative base URL so nginx proxies /api → api-gateway within the stack.
        # Override at build time if deploying behind a public domain:
        #   docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
