# Ecommerce microservices platform.
#
# Prerequisite: the service jars must exist in each repo's target/ directory.
# Run ./build-all.ps1 (Windows) or ./build-all.sh (Linux/macOS) first — the
# Dockerfiles copy a pre-built jar rather than compiling inside the image.

networks:
  ecommerce-network:
    driver: bridge

volumes:
  userdb-data:
  productdb-data:
  catalogdb-data:
  orderdb-data:
  paymentdb-data:
  shippingdb-data:
  reviewdb-data:
  kafka-data:
  # ─── Monitoring volumes ──────────────────────────────────────────────
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:

# ─── Shared fragments ──────────────────────────────────────────────────
#
# MaxRAMPercentage is required: with a mem_limit set, the JVM default of 25%
# would leave far too little heap, and without a mem_limit the JVM sizes its
# heap against the whole 16GB VM (~4GB max heap *per service*, which the host
# cannot honour ten times over).
# ActiveProcessorCount caps GC/ForkJoin/Netty pool sizing — the VM reports 32
# CPUs, so ten JVMs would otherwise each spin up ~23 GC threads.
x-java-env: &java-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  ENVIRONMENT: development
  JAVA_OPTS: >-
    -XX:MaxRAMPercentage=55
    -XX:ActiveProcessorCount=2
    -XX:+ExitOnOutOfMemoryError

# Spring Boot cold start under contention (10 JVMs booting at once) can exceed
# a minute, so the grace period is generous. Failures during start_period do
# not count against retries.
x-actuator-healthcheck: &actuator-healthcheck
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 90s

x-db-healthcheck: &db-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

# The json-file driver is unbounded by default, and a service that fails in a
# tight retry loop writes at disk speed. notification-service did exactly that
# against a poison-pill record on shipment.created and reached 992GB in one
# run, filling the Docker VM disk. 50m x 3 caps any single container at 150MB.
# (Kubernetes needs no equivalent: kubelet rotates at 10MB x 5 by default.)
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─── Infrastructure ─────────────────────────────────────────────────

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1200m
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx640m -Xms320m
      # An already-formatted kafka-data volume keeps its own cluster id; this
      # value only applies on a first, empty format.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─── Databases ──────────────────────────────────────────────────────

  userdb:
    image: postgres:16-alpine
    container_name: userdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5432:5432"
    volumes:
      - userdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U useruser -d userdb"]

  productdb:
    image: postgres:16-alpine
    container_name: productdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: productpass
    ports:
      - "5433:5432"
    volumes:
      - productdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb"]

  # catalog-service is the one MongoDB-backed service: the catalog is a
  # join-free read model of product-service (see ecommerce-catalog-service/
  # README.md). The container name, volume name and depends_on wiring are
  # unchanged so everything that addresses "catalogdb" keeps working; only the
  # engine behind the name changed. A catalogdb-data volume created by the
  # former Postgres image holds files Mongo cannot use — drop it once
  # (`docker compose down --volumes`, or `rebuild.ps1` without -KeepData).
  catalogdb:
    image: mongo:8.0
    container_name: catalogdb
    restart: unless-stopped
    logging: *default-logging
    # WiredTiger sizes its cache from the cgroup limit (50% of limit - 1GB,
    # minimum 256MB), which at this limit would be the entire container, so the
    # cache is pinned to its minimum explicitly. 512m leaves headroom for the
    # journal, connections and mongosh healthchecks on top of that cache.
    mem_limit: 512m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      # The root user lives in the admin database; clients authenticate with
      # authSource=admin (spring.mongodb.authentication-database in the service).
      MONGO_INITDB_ROOT_USERNAME: cataloguser
      MONGO_INITDB_ROOT_PASSWORD: catalogpass
      MONGO_INITDB_DATABASE: catalogdb
    ports:
      - "27017:27017"
    volumes:
      - catalogdb-data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      # Authenticated on purpose: the image's first boot runs a temporary,
      # auth-less mongod while it creates the root user, and an unauthenticated
      # ping would report healthy against that and release catalog-service too
      # early. $$ defers expansion to the container's shell.
      test:
        - CMD-SHELL
        - mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping').ok" | grep -q 1

  orderdb:
    image: postgres:16-alpine
    container_name: orderdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5434:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]

  paymentdb:
    image: postgres:16-alpine
    container_name: paymentdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: paymentuser
      POSTGRES_PASSWORD: paymentpass
    ports:
      - "5436:5432"
    volumes:
      - paymentdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U paymentuser -d paymentdb"]

  shippingdb:
    image: postgres:16-alpine
    container_name: shippingdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: shippinguser
      POSTGRES_PASSWORD: shippingpass
    ports:
      - "5437:5432"
    volumes:
      - shippingdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U shippinguser -d shippingdb"]

  reviewdb:
    image: postgres:16-alpine
    container_name: reviewdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: reviewdb
      POSTGRES_USER: reviewuser
      POSTGRES_PASSWORD: reviewpass
    ports:
      - "5438:5432"
    volumes:
      - reviewdb-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U reviewuser -d reviewdb"]

  # ─── Application Services ───────────────────────────────────────────

  service-discovery:
    build:
      context: ../ecommerce-service-discovery
      dockerfile: docker/Dockerfile
    container_name: service-discovery
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    ports:
      - "8761:8761"
    environment:
      <<: *java-env
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      start_period: 60s

  user-service:
    build:
      context: ../ecommerce-user-service
      dockerfile: docker/Dockerfile
    container_name: user-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8081:8081"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://userdb:5432/userdb
      DB_USERNAME: useruser
      DB_PASSWORD: userpass
      JWT_SECRET: ${JWT_SECRET:-myVerySecretJwtKeyThatIsAtLeast32CharactersLongForHS256}
    depends_on:
      userdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]

  product-service:
    build:
      context: ../ecommerce-product-service
      dockerfile: docker/Dockerfile
    container_name: product-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8082:8082"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://productdb:5432/productdb
      DB_USERNAME: productuser
      DB_PASSWORD: productpass
    depends_on:
      productdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]

  catalog-service:
    build:
      context: ../ecommerce-catalog-service
      dockerfile: docker/Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8083:8083"
    environment:
      <<: *java-env
      # MongoDB, not a JDBC datasource — same DB_USERNAME/DB_PASSWORD contract
      # as the other services, with the host in place of a JDBC URL. Port,
      # database name and authSource=admin are defaults in the service's
      # application.yaml.
      SPRING_MONGODB_HOST: catalogdb
      DB_USERNAME: cataloguser
      DB_PASSWORD: catalogpass
    depends_on:
      catalogdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]

  order-service:
    build:
      context: ../ecommerce-order-service
      dockerfile: docker/Dockerfile
    container_name: order-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8084:8084"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://orderdb:5432/orderdb
      DB_USERNAME: orderuser
      DB_PASSWORD: orderpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      orderdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]

  payment-service:
    build:
      context: ../ecommerce-payment-service
      dockerfile: docker/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8085:8085"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://paymentdb:5432/paymentdb
      DB_USERNAME: paymentuser
      DB_PASSWORD: paymentpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      paymentdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]

  shipping-service:
    build:
      context: ../ecommerce-shipping-service
      dockerfile: docker/Dockerfile
    container_name: shipping-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8086:8086"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://shippingdb:5432/shippingdb
      DB_USERNAME: shippinguser
      DB_PASSWORD: shippingpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      shippingdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]

  review-service:
    build:
      context: ../ecommerce-review-service
      dockerfile: docker/Dockerfile
    container_name: review-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8087:8087"
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://reviewdb:5432/reviewdb
      DB_USERNAME: reviewuser
      DB_PASSWORD: reviewpass
    depends_on:
      reviewdb:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]

  notification-service:
    build:
      context: ../ecommerce-notification-service
      dockerfile: docker/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    ports:
      - "8088:8088"
    environment:
      <<: *java-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]

  api-gateway:
    build:
      context: ../ecommerce-api-gateway
      dockerfile: docker/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      <<: *java-env
      JWT_SECRET: ${JWT_SECRET:-myVerySecretJwtKeyThatIsAtLeast32CharactersLongForHS256}
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *actuator-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]

  # ─── Monitoring Stack ────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ../ecommerce-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ecommerce-monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - ecommerce-network
    depends_on:
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceQLStreaming metricsSummary
    volumes:
      - ../ecommerce-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ecommerce-monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../ecommerce-monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../ecommerce-monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ecommerce-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: -config.file=/etc/tempo/tempo-config.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../ecommerce-monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../ecommerce-monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Infrastructure Exporters ────────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro
    networks:
      - ecommerce-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 320m
    privileged: true
    # --docker_only drops the raw cgroup hierarchy, which on the Docker Desktop
    # VM is noise; housekeeping_interval trims cAdvisor's own CPU cost.
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    ports:
      - "9095:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - ecommerce-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
    ports:
      - "9308:9308"
    networks:
      - ecommerce-network
    depends_on:
      kafka:
        condition: service_healthy

  # Topic / consumer-group browser. The monitoring README documented this at
  # :8090 but the service was never defined here.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2
    networks:
      - ecommerce-network
    depends_on:
      kafka:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command: --config.file=/etc/blackbox/blackbox-config.yml
    ports:
      - "9115:9115"
    volumes:
      - ../ecommerce-monitoring/blackbox-exporter/blackbox-config.yml:/etc/blackbox/blackbox-config.yml:ro
    networks:
      - ecommerce-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    command:
      - --nginx.scrape-uri=http://frontend:80/stub_status
    ports:
      - "9113:9113"
    networks:
      - ecommerce-network
    depends_on:
      - frontend

  # ─── PostgreSQL Exporters (one per database) ─────────────────────────

  postgres-exporter-userdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-userdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://useruser:userpass@userdb:5432/userdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9187:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      userdb:
        condition: service_healthy
    labels:
      database: userdb

  postgres-exporter-productdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-productdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://productuser:productpass@productdb:5432/productdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9188:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      productdb:
        condition: service_healthy
    labels:
      database: productdb

  postgres-exporter-orderdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-orderdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://orderuser:orderpass@orderdb:5432/orderdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9190:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      orderdb:
        condition: service_healthy
    labels:
      database: orderdb

  postgres-exporter-paymentdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-paymentdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://paymentuser:paymentpass@paymentdb:5432/paymentdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9191:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      paymentdb:
        condition: service_healthy
    labels:
      database: paymentdb

  postgres-exporter-shippingdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-shippingdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://shippinguser:shippingpass@shippingdb:5432/shippingdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9192:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      shippingdb:
        condition: service_healthy
    labels:
      database: shippingdb

  postgres-exporter-reviewdb:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-reviewdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: postgresql://reviewuser:reviewpass@reviewdb:5432/reviewdb?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    ports:
      - "9193:9187"
    volumes:
      - ../ecommerce-monitoring/postgres-exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks:
      - ecommerce-network
    depends_on:
      reviewdb:
        condition: service_healthy
    labels:
      database: reviewdb

  # ─── MongoDB Exporter (catalogdb) ────────────────────────────────────
  # The Mongo counterpart of the postgres exporters above; prometheus.yml
  # scrapes it as mongodb-exporter-catalogdb:9216 and database-alerts.yml
  # fires MongoDown on mongodb_up == 0.
  mongodb-exporter-catalogdb:
    image: percona/mongodb_exporter:0.53.0
    container_name: mongodb-exporter-catalogdb
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      MONGODB_URI: mongodb://cataloguser:catalogpass@catalogdb:27017/admin
    command:
      - --collector.diagnosticdata
      - --collector.dbstats
      # Also emit the pre-0.20 metric names (mongodb_connections, mongodb_op_counters_total…)
      # that most community dashboards use.
      - --compatible-mode
      - --web.listen-address=:9216
    ports:
      - "9216:9216"
    networks:
      - ecommerce-network
    depends_on:
      catalogdb:
        condition: service_healthy
    labels:
      database: catalogdb

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../ecommerce-frontend
      dockerfile: Dockerfile
      args:
        # Relative base URL so nginx proxies /api → api-gateway within the stack.
        # Override at build time if deploying behind a public domain:
        #   docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    container_name: frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first,
      # and nginx' 'listen 80' binds IPv4 only, so the probe was refused.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
